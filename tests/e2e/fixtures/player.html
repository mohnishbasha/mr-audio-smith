<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Player fixture</title>
    <script type="module" src="/player/dist/audio-smith-player.js"></script>
  </head>
  <body>
    <main>
      <h1>Letter</h1>
      <audio-smith-player
        id="default"
        src="tone.mp3"
        captions="tone.vtt"
        label="Listen to Dad read this letter"
        artist="Dad"
        peaks="12,30,44,61,58,40,35,52,70,66,48,39,28,33,47,59,72,64,50,41,36,30,26,34,45,38,24,15"
        tracks='[{"lang":"en","label":"English","src":"tone.mp3","captions":"tone.vtt"},{"lang":"hi","label":"Hindi","src":"tone-hi.mp3","captions":"tone-hi.vtt"}]'
      >
        <audio controls src="tone.mp3"></audio>
      </audio-smith-player>
      <audio-smith-player
        id="kid"
        src="tone.mp3"
        size="kid"
        label="Listen"
        peaks="12,30,44,61,58,40,35,52,70,66,48,39,28,33,47,59,72,64,50,41,36,30,26,34,45,38,24,15"
      >
        <audio controls src="tone.mp3"></audio>
      </audio-smith-player>
    </main>
  </body>
</html>
