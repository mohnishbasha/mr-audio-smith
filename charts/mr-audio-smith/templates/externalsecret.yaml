{{- if and .Values.secrets.externalSecret.enabled (not .Values.standIn.enabled) }}
{{- $es := .Values.secrets.externalSecret }}
{{- if not $es.key }}
{{- fail "secrets.externalSecret.key is required (e.g. stoke/mr-audio-smith)" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mr-audio-smith.fullname" . }}
  labels:
    {{- include "mr-audio-smith.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ include "mr-audio-smith.secretName" . }}
    creationPolicy: Owner
  data:
    # The server token the API requires because it binds 0.0.0.0 (env AUDIO_SMITH_SERVER_TOKEN).
    - secretKey: {{ .Values.auth.existingSecretKey }}
      remoteRef:
        key: {{ $es.key }}
        property: {{ $es.property }}
{{- end }}
