{{- if include "mr-audio-smith.mayaEnabled" . }}
# Cluster-internal only: Maya 2 has no authentication. Never add an Ingress or LoadBalancer for it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mr-audio-smith.fullname" . }}-maya2
  labels:
    {{- include "mr-audio-smith.labels" (dict "ctx" . "component" "maya2") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: maya2
      port: 8080
      targetPort: maya2
      protocol: TCP
  selector:
    {{- include "mr-audio-smith.selectorLabels" (dict "ctx" . "component" "maya2") | nindent 4 }}
{{- end }}
