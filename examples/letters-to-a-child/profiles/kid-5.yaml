id: kid-5
version: 1.1.0
description: A five-year-old listener, bedtime letters from Dad
audience:
  age: 5
  attention_minutes: 6
writing:
  target_minutes: 5
  max_sentence_words: 12
  explain_big_words: true
  spoken_transitions: true
  interactive_moments: 2
  keep_signature_verbatim: true
  forbidden: [sarcasm, scary_detail, brand_names_without_context]
  parent_headings: ["A grown-up note"]
speech:
  rate: 0.9
  pause_after_heading_ms: 800
  pause_between_chunks_ms: 350
  max_chunk_chars: 360
languages: [en]
tracks:
  parent: adult-brief
lexicon:
  Aadi: AH-dee
  Houston: HYOO-stun
