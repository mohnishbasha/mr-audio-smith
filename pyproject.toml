[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mr-audio-smith"
version = "1.0.0-rc.1"
description = "Turn any web page into a realistic, audience-tuned narration with your own cloned voice, generated locally, embedded with one tag."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serverless Ventures LLC" }]
requires-python = ">=3.12,<3.14"
keywords = ["tts", "text-to-speech", "narration", "voice-cloning", "maya2", "accessibility", "local-first", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "selectolax>=1.0",
  "trafilatura>=1.12",
  "emoji>=2.12",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pydub>=0.25",
  "openai>=1.40",
  "keyring>=25.0",
  "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.optional-dependencies]
# Maya 2 Native in-process mode. The maya3 package is not on PyPI (PyPI forbids direct URL
# dependencies), so install it next to this extra:
#   uv pip install "maya3 @ git+https://github.com/MayaResearch/maya2-native@79142d835fc745537fc5ab71a007eba8f425c74c"
maya2 = ["torch>=2.4"]
kokoro = ["kokoro>=0.9.4; python_version < '3.13'", "torch>=2.4; python_version < '3.13'"]
# Chatterbox is not an extra: chatterbox-tts hard-pins old torch, transformers, gradio, and pillow
# releases with open advisories (docs/SECURITY_REVIEW.md). Install it yourself to use the backend:
#   uv pip install chatterbox-tts
qa = ["resemblyzer>=0.1.4", "setuptools>=69,<81"]  # resemblyzer imports pkg_resources
cloud = ["anthropic>=0.34"]
server = ["fastapi>=0.112", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
mcp = ["mcp>=1.2"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "respx>=0.21",
  "syrupy>=4.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "pip-licenses>=5.0",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "types-PyYAML",
  "jsonschema>=4.23",
  "types-jsonschema",
  "import-linter>=2.1",
  "codespell>=2.3",
]

[project.scripts]
mr-audio-smith = "audio_smith.cli:main"

[project.urls]
Homepage = "https://getaudiosmith.com"
Repository = "https://github.com/mohnishbasha/mr-audio-smith"
Issues = "https://github.com/mohnishbasha/mr-audio-smith/issues"
Changelog = "https://github.com/mohnishbasha/mr-audio-smith/blob/develop/CHANGELOG.md"

[tool.hatch.build]
# Built UI bundles are gitignored but must ship in the wheel (make studio-build player-assets).
artifacts = ["audio_smith/studio/static/**", "audio_smith/_assets/player/**"]

[tool.hatch.build.targets.wheel]
packages = ["audio_smith"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "audio_smith/_schemas"
"assets/stings" = "audio_smith/_assets/stings"

[tool.hatch.build.targets.sdist]
include = ["audio_smith", "schemas", "assets", "README.md", "LICENSE", "THIRD_PARTY_LICENSES.md", "CHANGELOG.md"]


[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["audio_smith/studio/static", "node_modules", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PTH", "TID", "PL", "TD"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "TD003", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "C408", "S101", "S105", "S106", "S108", "PLR0915", "PLC0415", "S310", "S603", "S607"]
"scripts/**" = ["S603", "S607", "T201"]
"assets/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["audio_smith"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["selectolax.*", "trafilatura.*", "pydub.*", "soundfile.*", "kokoro.*", "maya3.*",
          "resemblyzer.*", "chatterbox.*", "torch.*", "keyring.*", "emoji.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not gpu'"
markers = [
  "integration: needs real ffmpeg, Ollama, Kokoro, or a server",
  "gpu: needs an NVIDIA GPU and a Maya 2 server",
  "slow: takes more than a few seconds",
  "flaky_quarantine: quarantined flaky test with a linked issue",
]
timeout = 120
python_functions = ["test_*", "it_*", "smoke_*", "e2e_*", "regression_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["audio_smith"]
branch = true
omit = ["audio_smith/studio/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.importlinter]
root_package = "audio_smith"

[[tool.importlinter.contracts]]
name = "Front doors use the public API only"
type = "forbidden"
source_modules = ["audio_smith.cli", "audio_smith.cli_commands", "audio_smith.site_cli", "audio_smith.server", "audio_smith.mcp_server", "audio_smith.studio"]
forbidden_modules = [
  "audio_smith.fetch", "audio_smith.extract", "audio_smith.script.writer", "audio_smith.master.ffmpeg",
  "audio_smith.master.assemble", "audio_smith.tts.maya2", "audio_smith.tts.kokoro",
]
allow_indirect_imports = true

[tool.codespell]
skip = "*.lock,*.svg,node_modules,tests/fixtures,*.json,dist,Prompt.md"
ignore-words-list = "aadi,te,ot,nd,ba"
