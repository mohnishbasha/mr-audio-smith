apiVersion: v1
kind: Service
metadata:
  name: {{ include "mr-audio-smith.fullname" . }}
  labels:
    {{- include "mr-audio-smith.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mr-audio-smith.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
