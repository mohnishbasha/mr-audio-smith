{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mr-audio-smith.fullname" . }}
  labels:
    {{- include "mr-audio-smith.labels" (dict "ctx" . "component" "api") | nindent 4 }}
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "mr-audio-smith.fullname" .) }}
  {{- if .Values.auth.token }}
  {{ .Values.auth.existingSecretKey }}: {{ .Values.auth.token | b64enc | quote }}
  {{- else if and $existing $existing.data (hasKey $existing.data .Values.auth.existingSecretKey) }}
  {{ .Values.auth.existingSecretKey }}: {{ index $existing.data .Values.auth.existingSecretKey | quote }}
  {{- else }}
  {{ .Values.auth.existingSecretKey }}: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
{{- end }}
